<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BountyMc.de - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="orbs-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
        <div class="orb orb-6"></div>
    </div>

    <div id="loginPage" class="login-container">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon">
                    <img src="logo.png" alt="BountyMc Logo" onerror="this.parentElement.innerHTML='<svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><path d=\'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\'/></svg>'">
                </div>
                <h1>BountyMc.de</h1>
                <p>Team Dashboard</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" placeholder="deine@email.de" required>
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" placeholder="Passwort eingeben" required>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="btn-login">Einloggen</button>
            </form>
            <div style="margin-top:24px;text-align:center;color:var(--t3);font-size:11px">
                Zuerst <code>db/init.php</code> aufrufen zum Installieren
            </div>
        </div>
    </div>

    <div id="dashboardPage" class="dashboard" style="display:none;">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="server-logo">
                    <img src="logo.png" alt="BountyMc" onerror="this.parentElement.innerHTML='<svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><path d=\'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\'/></svg>'">
                </div>
                <div class="server-info">
                    <h2>BountyMc.de</h2>
                    <span class="server-status online">Online</span>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <img class="user-avatar" id="userAvatar" src="" alt="">
                    <div class="user-info">
                        <span class="user-name" id="userName"></span>
                        <span class="user-role" id="userRole"></span>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Abmelden">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                    </svg>
                </button>
            </div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <h1 class="page-title" id="pageTitle">Dashboard</h1>
                <div class="topbar-actions"><span class="current-time" id="currentTime"></span></div>
            </header>
            <div class="content-area" id="contentArea"></div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
